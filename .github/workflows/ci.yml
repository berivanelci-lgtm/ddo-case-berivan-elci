name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (biçim, vet, build, test, kapsama)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: backend/go.sum

      - name: Biçim kontrolü (gofmt)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt gerekli:"
            echo "$unformatted"
            exit 1
          fi

      - name: Statik analiz (go vet)
        run: go vet ./...

      - name: Derleme
        run: go build ./...

      - name: Testler ve kapsama
        run: go test ./... -covermode=atomic -coverprofile=coverage.out

      - name: Toplam kapsama
        run: go tool cover -func=coverage.out | tail -n 1

  images:
    name: Konteyner imajları
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Backend imajı
        run: docker build -t hatkontrol-backend ./backend

      - name: Frontend imajı
        run: docker build -t hatkontrol-frontend ./frontend
              - name: Simülatör imajı
        run: docker build -f backend/Dockerfile.simulator -t hatkontrol-simulator ./backend
        