services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      DEMO_PASSWORD: ${DEMO_PASSWORD}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health > /dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build: ./frontend
    ports:
      - "3000:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ > /dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
  simulator:
    build:
      context: ./backend
      dockerfile: Dockerfile.simulator
    environment:
      API_URL: http://backend:8080
      DEMO_PASSWORD: ${DEMO_PASSWORD}
      SIM_SEED: ${SIM_SEED:-42}
      SIM_INTERVAL: ${SIM_INTERVAL:-5s}
      SIM_STATIONS: ${SIM_STATIONS:-50}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "find /tmp/heartbeat -mmin -1 | grep -q heartbeat"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
volumes:
  pgdata: