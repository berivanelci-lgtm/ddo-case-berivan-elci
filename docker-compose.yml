services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      DEMO_PASSWORD: ${DEMO_PASSWORD}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health > /dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build: ./frontend
    ports:
      - "3000:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ > /dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  simulator:
    build:
      context: ./backend
      dockerfile: Dockerfile.simulator
    environment:
      API_URL: http://backend:8080
      DEMO_PASSWORD: ${DEMO_PASSWORD}
      SIM_SEED: ${SIM_SEED:-42}
      SIM_INTERVAL: ${SIM_INTERVAL:-5s}
      SIM_STATIONS: ${SIM_STATIONS:-50}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "find /tmp/heartbeat -mmin -1 | grep -q heartbeat"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  # --- Aşağıdaki iki servis yalnızca "docker compose --profile verify run --rm verify" ile çalışır ---

  # Soy ağacı verisi (1M parti) yoksa yükler; varsa dokunmaz.
  genealogy-seed:
    image: postgres:16-alpine
    profiles: ["verify"]
    depends_on:
      backend:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    volumes:
      - ./scripts:/scripts:ro
    entrypoint: ["sh", "-c"]
    command:
      - |
        if [ "$$(psql -tAc 'SELECT count(*) FROM lots')" = "0" ]; then
          echo "Seeding 1,000,000 lots..."
          psql -q -v ON_ERROR_STOP=1 -f /scripts/seed-genealogy.sql
        else
          echo "Genealogy data already present."
        fi

  # verify.ps1'i PowerShell konteynerinde çalıştırır; makinede yalnızca Docker gerekir.
  verify:
    image: mcr.microsoft.com/powershell:latest
    profiles: ["verify"]
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
      simulator:
        condition: service_healthy
      genealogy-seed:
        condition: service_completed_successfully
    environment:
      FRONTEND_URL: http://frontend:8080
    volumes:
      - ./scripts:/scripts:ro
    entrypoint: ["pwsh", "-NoProfile", "-File", "/scripts/verify.ps1", "-BaseUrl", "http://backend:8080"]

volumes:
  pgdata: