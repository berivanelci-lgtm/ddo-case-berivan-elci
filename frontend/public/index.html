<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HatKontrol</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>HatKontrol</h1>
    <div id="session-info" hidden>
      <span id="user-name"></span>
      <button id="logout-button" type="button" class="secondary">Çıkış</button>
    </div>
  </header>

  <main>
    <noscript>Bu uygulama JavaScript gerektirir.</noscript>

    <section id="login-view" hidden>
      <h2>Giriş yap</h2>
      <form id="login-form">
        <label for="email">E-posta</label>
        <input id="email" type="email" autocomplete="username" required>

        <label for="password">Parola</label>
        <input id="password" type="password" autocomplete="current-password" required>

        <p id="login-error" class="error" role="alert" hidden></p>
        <button id="login-button" type="submit">Giriş yap</button>
      </form>
    </section>

    <section id="app-view" hidden>
      <div class="section-head">
        <h2>Kontrol grafikleri</h2>
        <button id="refresh-button" type="button" class="secondary">Yenile</button>
      </div>
      <p id="charts-status" role="status"></p>
      <ul id="charts-list" class="cards"></ul>
    </section>

    <section id="detail-view" hidden>
      <a href="#/" class="back-link">← Grafiklere dön</a>
      <h2 id="detail-title"></h2>
      <p id="detail-meta" class="muted"></p>
      <p id="detail-status" role="status"></p>

      <div id="detail-content" hidden>
        <div class="chart-wrap">
          <svg id="spc-chart" role="img" aria-label="Kontrol grafiği"></svg>
        </div>
        <p id="chart-empty" class="muted" hidden>Bu grafiğe henüz ölçüm girilmedi.</p>
        <p id="limits-info" class="muted"></p>

        <div class="panel">
          <form id="measure-form" hidden>
            <label for="measure-values" id="measure-label">Ölçüm değeri</label>
            <input id="measure-values" type="text" inputmode="decimal" autocomplete="off" required>
            <button id="measure-button" type="submit">Ölçüm ekle</button>
          </form>
          <button id="recompute-button" type="button" class="secondary" hidden>Limitleri yeniden hesapla</button>
          <p id="measure-message" role="status" hidden></p>
        </div>

        <h3>Son alarmlar</h3>
        <p id="alarms-empty" class="muted" hidden>Alarm yok.</p>
        <ul id="alarms-list" class="cards"></ul>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
