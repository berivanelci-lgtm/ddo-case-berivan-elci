<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HatKontrol</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>HatKontrol</h1>
    <div id="session-info" hidden>
      <span id="user-name"></span>
      <button id="logout-button" type="button" class="secondary">Çıkış</button>
    </div>
  </header>

  <main>
    <noscript>Bu uygulama JavaScript gerektirir.</noscript>

    <section id="login-view" hidden>
      <h2>Giriş yap</h2>
      <form id="login-form">
        <label for="email">E-posta</label>
        <input id="email" type="email" autocomplete="username" required>

        <label for="password">Parola</label>
        <input id="password" type="password" autocomplete="current-password" required>

        <p id="login-error" class="error" role="alert" hidden></p>
        <button id="login-button" type="submit">Giriş yap</button>
      </form>
    </section>

    <section id="app-view" hidden>
      <div class="section-head">
        <h2>Kontrol grafikleri</h2>
        <button id="refresh-button" type="button" class="secondary">Yenile</button>
      </div>
      <p id="charts-status" role="status"></p>
      <ul id="charts-list" class="cards"></ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
