server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # /api/ ile başlayan istekler backend'e gider, /api/ öneki kaldırılır.
    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}